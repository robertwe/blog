name: build and deploy

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Friday 21:17 UTC = 22:17 CET / 23:17 CEST. Publishes posts whose date has passed
    # (Jekyll skips future-dated posts), so scheduled posts are dated Friday 22:00 local.
    - cron: '17 21 * * 5'
    # Daily 06:17 UTC = 08:17 CEST / 07:17 CET, for posts scheduled for a morning.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: docker.io/library/ruby:3.4   # same image as the Containerfile / make build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
      - run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4
      - name: stamp the build with the commit (shown in the footer)
        run: |
          printf 'commit: %s\nfull: %s\nbuilt: %s\n' "${GITHUB_SHA:0:7}" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%MZ)" > _data/build.yml
          cat _data/build.yml
      - run: bundle exec jekyll build -d docs
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # firebase.json / .firebaserc
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: docs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROBERTS_NOTES }}
          projectId: roberts-notes
          channelId: live
