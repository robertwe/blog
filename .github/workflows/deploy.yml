name: build and deploy

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: docker.io/library/ruby:3.4   # same image as the Containerfile / make build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
      - run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4
      - run: bundle exec jekyll build -d docs
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs
          retention-days: 7

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # firebase.json / .firebaserc
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: docs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROBERTS_NOTES }}
          projectId: roberts-notes
          channelId: live
